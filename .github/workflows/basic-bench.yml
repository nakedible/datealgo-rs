name: Verify basic benchmark

on:
  pull_request:
    branches: ["master"]

permissions:
  contents: read
  pull-requests: write

jobs:
  verify-basic-bench:
    name: verify basic benchmark (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    concurrency:
      group: basic-bench-${{ github.event.pull_request.number }}-${{ matrix.arch }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@v2

      # The x86-64 Linux target links with LLD already, and scripts/ab_lib.sh
      # needs it to shuffle the functions elsewhere
      - name: Install LLD
        if: runner.arch != 'X64'
        run: sudo apt-get install -y lld

      - name: Run benchmark verification
        id: verify
        # Fail if the script fails, not only if the last command of a pipe does
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          scripts/basic_ab.sh "$BASE_SHA" | tee basic-bench-report.txt
          {
            echo '```text'
            cat basic-bench-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "cpu=$(lscpu | sed -n 's/^Model name: *//p' | head -n 1)" >> "$GITHUB_OUTPUT"

      - name: Upload measurements
        uses: actions/upload-artifact@v7
        with:
          name: basic-bench-${{ matrix.arch }}
          path: target/basic-ab/dump

      # Pull requests from forks get a token that cannot comment, so their
      # report is only in the job summary
      - name: Add pull request comment
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9
        env:
          ARCH: ${{ matrix.arch }}
          CPU: ${{ steps.verify.outputs.cpu }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const fs = require("fs");

            const arch = process.env.ARCH;
            const marker = `<!-- verify-basic-bench ${arch} -->`;
            const report = fs.readFileSync("basic-bench-report.txt", "utf8").trimEnd();
            const baseSha = process.env.BASE_SHA;
            const headSha = process.env.HEAD_SHA;

            const body = [
              marker,
              `## Basic benchmark verification (${arch})`,
              "",
              "Compared each function of this pull request with its base in the basic benchmarks with `./scripts/basic_ab.sh`.",
              `Compared commits: ${baseSha} -> ${headSha}`,
              `Runner CPU: ${process.env.CPU}`,
              "",
              "```text",
              report,
              "```",
            ].join("\n");

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            // Comments from before the arch-specific markers belong to x86_64.
            const legacyMarker = "<!-- verify-basic-bench -->";
            const isOurs = (body) =>
              body?.includes(marker) || (arch === "x86_64" && body?.startsWith(legacyMarker));
            const existing = comments.find((comment) =>
              comment.user?.type === "Bot" && isOurs(comment.body)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
