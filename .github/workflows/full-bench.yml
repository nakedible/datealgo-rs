name: Full benchmark

# Runs the full benchmark suites on demand, for example:
#
#   gh workflow run full-bench.yml --ref master -f runner=ubuntu-24.04-arm
#
# Results go to the run summary and are uploaded as artifacts. GitHub runners
# are shared VMs, so compare numbers within one run rather than across runs.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner to benchmark on
        type: choice
        options:
          - all
          - ubuntu-24.04-arm
          - ubuntu-latest
        default: all
      harness:
        description: Benchmark harness
        type: choice
        options:
          - zenbench
          - criterion
          - both
          - experiments
        default: zenbench
      criterion-args:
        description: Extra arguments for Criterion
        type: string
        default: --sample-size 200 --warm-up-time 1 --measurement-time 3

permissions:
  contents: read

jobs:
  full-bench:
    name: full benchmark (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.runner == 'all' && '["ubuntu-latest", "ubuntu-24.04-arm"]' || format('["{0}"]', inputs.runner)) }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Describe runner
        run: |
          {
            echo "# Full benchmark on \`${{ matrix.runner }}\`"
            echo
            echo "- Commit: \`$(git rev-parse HEAD)\`"
            echo "- CPU: $(lscpu | sed -n 's/^Model name: *//p' | head -n 1)"
            echo "- Rust: \`$(rustc --version)\`"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      # The resource gate would only add waits on a dedicated runner.
      - name: Run Zenbench suites
        if: inputs.harness == 'zenbench' || inputs.harness == 'both'
        env:
          ZENBENCH_NO_BUSY_GATE: "1"
        run: |
          mkdir -p results
          for bench in compare basic; do
            ZENBENCH_RESULT_PATH="$PWD/results/zenbench-$bench.json" \
              taskset -c 0 cargo bench --locked --bench "$bench" -- --format=md \
              > "results/zenbench-$bench.md"
            cat "results/zenbench-$bench.md" >> "$GITHUB_STEP_SUMMARY"
          done

      # The experiment suite (benches/exp.rs) compares candidates from
      # src/experiments.rs, so it is mostly useful on experiment branches.
      - name: Run experiment suite
        if: inputs.harness == 'experiments'
        env:
          ZENBENCH_NO_BUSY_GATE: "1"
        run: |
          mkdir -p results
          ZENBENCH_RESULT_PATH="$PWD/results/zenbench-exp.json" \
            taskset -c 0 cargo bench --locked --features experiments --bench exp -- --format=md \
            > results/zenbench-exp.md
          cat results/zenbench-exp.md >> "$GITHUB_STEP_SUMMARY"

      - name: Run Criterion suites
        if: inputs.harness == 'criterion' || inputs.harness == 'both'
        env:
          CRITERION_ARGS: ${{ inputs.criterion-args }}
        run: |
          mkdir -p results
          for bench in compare_criterion basic_criterion; do
            # CRITERION_ARGS is split into separate arguments on purpose.
            # shellcheck disable=SC2086
            taskset -c 0 cargo bench --locked --features criterion-benches --bench "$bench" -- $CRITERION_ARGS
          done
          python3 - >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import json
          import pathlib

          rows = []
          for path in sorted(pathlib.Path("target/criterion").glob("**/new/estimates.json")):
              name = "/".join(path.relative_to("target/criterion").parts[:-2])
              mean = json.loads(path.read_text())["mean"]["point_estimate"]
              rows.append(f"| `{name}` | {mean:.2f} |")
          print("## Criterion")
          print()
          print("| Benchmark | Mean (ns) |")
          print("|---|---|")
          print("\n".join(rows))
          EOF
          cp -r target/criterion results/criterion

      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: full-bench-${{ matrix.runner }}
          path: results
