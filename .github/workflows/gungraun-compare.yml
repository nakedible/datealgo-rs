name: Compare instruction counts

on:
  pull_request:
    branches: ["master"]

permissions:
  contents: read
  pull-requests: write

jobs:
  compare-instructions:
    name: compare instruction counts (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
            valgrind-strategy: builder,source,system
          # gungraun/valgrind-builder only has x86_64 builds, so use Ubuntu's
          # Valgrind instead of building it from source.
          - runner: ubuntu-24.04-arm
            arch: aarch64
            valgrind-strategy: system
    concurrency:
      group: gungraun-compare-${{ github.event.pull_request.number }}-${{ matrix.arch }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@v2

      # Installs Valgrind and the gungraun-runner version that matches the
      # gungraun library in Cargo.lock.
      - uses: gungraun/setup-gungraun@v1
        with:
          valgrind-strategy: ${{ matrix.valgrind-strategy }}

      - name: Run instruction count comparison
        id: compare
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set +e
          python3 scripts/compare_gungraun_against_ref.py \
            --git-ref "$BASE_SHA" \
            > gungraun-compare-report.txt
          status=$?
          set -e

          cat gungraun-compare-report.txt

          case "$status" in
            0|1|3) ;;
            *) exit "$status" ;;
          esac

          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Upload instruction count comparison report
        uses: actions/upload-artifact@v7
        with:
          name: gungraun-compare-report-${{ matrix.arch }}
          path: gungraun-compare-report.txt

      - name: Add pull request comment
        uses: actions/github-script@v9
        env:
          COMPARE_STATUS: ${{ steps.compare.outputs.status }}
          ARCH: ${{ matrix.arch }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require("fs");

            const arch = process.env.ARCH;
            const marker = `<!-- compare-gungraun ${arch} -->`;
            const report = fs.readFileSync("gungraun-compare-report.txt", "utf8").trimEnd();
            const status = process.env.COMPARE_STATUS;
            const baseSha = process.env.BASE_SHA;
            const headSha = process.env.HEAD_SHA;
            const runUrl = process.env.RUN_URL;
            const headline = {
              "0": "No instruction count changes detected.",
              "1": "Instruction count changes detected.",
              "3": "The base commit has no gungraun benchmarks to compare against, so only the counts for this branch are shown.",
            }[status];
            const prefix = [
              marker,
              `## Instruction count comparison (${arch})`,
              "",
              headline,
              "",
              "Compared this pull request branch head against its base commit with `./scripts/compare_gungraun_against_ref.py`.",
              `Compared commits: ${baseSha} -> ${headSha}`,
              `Actions run: ${runUrl}`,
              "",
            ].join("\n");

            const MAX_BODY_CHARS = 60000;
            let body = `${prefix}\n\`\`\`text\n${report}\n\`\`\``;
            if (body.length > MAX_BODY_CHARS) {
              const suffix = [
                "",
                "_Report truncated in the comment. See the Actions run log above for the full output._",
              ].join("\n");
              const available = MAX_BODY_CHARS - prefix.length - suffix.length - "\n```text\n\n```".length;
              const truncatedReport = report.slice(0, Math.max(0, available));
              body = `${prefix}\n\`\`\`text\n${truncatedReport}\n\`\`\`${suffix}`;
            }

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            // Comments from before the arch-specific markers belong to x86_64.
            const legacyMarker = "<!-- compare-gungraun -->";
            const isOurs = (body) =>
              body?.includes(marker) || (arch === "x86_64" && body?.startsWith(legacyMarker));
            const existing = comments.find((comment) =>
              comment.user?.type === "Bot" && isOurs(comment.body)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
