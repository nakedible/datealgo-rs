name: Compare instruction counts

on:
  pull_request:
    branches: ["master"]

permissions:
  contents: read
  pull-requests: write

jobs:
  compare-instructions:
    name: compare instruction counts
    runs-on: ubuntu-latest
    concurrency:
      group: gungraun-compare-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      # Check out the merge commit, which pull requests do by default, so that
      # comparing against the base commit shows only this pull request's
      # changes even when the branch is behind its base.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for gungraun benchmarks
        id: check
        run: |
          if [ -f benches/gungraun.rs ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "No gungraun benchmarks in this commit, skipping the comparison."
          fi

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        if: steps.check.outputs.present == 'true'

      # Installs Valgrind and the gungraun-runner version that matches the
      # gungraun library in Cargo.lock.
      - uses: gungraun/setup-gungraun@v1
        if: steps.check.outputs.present == 'true'

      - name: Run instruction count comparison
        id: compare
        if: steps.check.outputs.present == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set +e
          python3 scripts/compare_gungraun_against_ref.py \
            --git-ref "$BASE_SHA" \
            > gungraun-compare-report.txt
          status=$?
          set -e

          cat gungraun-compare-report.txt

          case "$status" in
            0|1|3) ;;
            *) exit "$status" ;;
          esac

          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Upload instruction count comparison report
        if: steps.check.outputs.present == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: gungraun-compare-report
          path: gungraun-compare-report.txt

      - name: Add pull request comment
        if: steps.check.outputs.present == 'true'
        uses: actions/github-script@v9
        env:
          COMPARE_STATUS: ${{ steps.compare.outputs.status }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require("fs");

            const marker = "<!-- compare-gungraun -->";
            const report = fs.readFileSync("gungraun-compare-report.txt", "utf8").trimEnd();
            const status = process.env.COMPARE_STATUS;
            const baseSha = process.env.BASE_SHA;
            const headSha = process.env.HEAD_SHA;
            const mergeSha = process.env.MERGE_SHA;
            const runUrl = process.env.RUN_URL;
            const headline = {
              "0": "No instruction count changes detected.",
              "1": "Instruction count changes detected.",
              "3": "The base commit has no gungraun benchmarks to compare against, so only the counts for this branch are shown.",
            }[status];
            const prefix = [
              marker,
              "## Instruction count comparison",
              "",
              headline,
              "",
              "Compared this pull request, merged into its base, against the base commit with `./scripts/compare_gungraun_against_ref.py`.",
              `Compared commits: ${baseSha} -> ${mergeSha} (merge of ${headSha})`,
              `Actions run: ${runUrl}`,
              "",
            ].join("\n");

            const MAX_BODY_CHARS = 60000;
            let body = `${prefix}\n\`\`\`text\n${report}\n\`\`\``;
            if (body.length > MAX_BODY_CHARS) {
              const suffix = [
                "",
                "_Report truncated in the comment. See the Actions run log above for the full output._",
              ].join("\n");
              const available = MAX_BODY_CHARS - prefix.length - suffix.length - "\n```text\n\n```".length;
              const truncatedReport = report.slice(0, Math.max(0, available));
              body = `${prefix}\n\`\`\`text\n${truncatedReport}\n\`\`\`${suffix}`;
            }

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find((comment) =>
              comment.user?.type === "Bot" && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
