name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: actions-rust-lang/setup-rust-toolchain@v2
      with:
        components: clippy, rustfmt
    - name: Build
      run: cargo build --locked --verbose
    - name: Build without std
      run: cargo build --locked --verbose --no-default-features
    - name: Build with asmdump
      run: cargo build --locked --verbose --features asmdump
    - name: Run tests
      run: cargo test --locked --verbose
    - name: Check format
      run: cargo fmt -- --check
    - name: Check clippy
      run: cargo clippy --locked --all-targets --all-features -- -D warnings
    - name: Check clippy without std
      run: cargo clippy --locked --lib --no-default-features --features asmdump -- -D warnings
    - name: Check docs
      run: cargo doc --locked --no-deps
      env:
        RUSTDOCFLAGS: -D warnings
    - name: Install cargo-readme
      uses: taiki-e/install-action@v2
      with:
        tool: cargo-readme
    - name: Check that `README.md` is up-to-date
      run: cargo readme | diff -u README.md -
