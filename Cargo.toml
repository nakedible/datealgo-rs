[package]
name = "datealgo"
version = "0.2.3"
edition = "2021"
rust-version = "1.57"
autobenches = false
authors = ["Nuutti Kotivuori <naked@iki.fi>"]
description = "Low-level date algorithms for libraries"
keywords = ["calendar", "date", "gregorian", "algorithm"]
categories = ["algorithms", "date-and-time", "no-std", "no-std::no-alloc"]
homepage = "https://github.com/nakedible/datealgo-rs"
repository = "https://github.com/nakedible/datealgo-rs"
license = "MIT OR Apache-2.0"
include = ["/src/", "/README.md", "/CHANGELOG.md", "/LICENSE-APACHE", "/LICENSE-MIT"]

[features]
default = ["std"]
std = []
asmdump = []
experiments = []
criterion-benches = []
gungraun-bench = []

[lib]
path = "src/lib.rs"
bench = false

[[bench]]
name = "exp"
harness = false
required-features = ["experiments"]

[[bench]]
name = "app_libs"
harness = false

[[bench]]
name = "app_ab"
harness = false

[[bench]]
name = "basic_ab"
harness = false

[[bench]]
name = "compare"
path = "benches/compare_zen.rs"
harness = false

[[bench]]
name = "basic"
path = "benches/basic_zen.rs"
harness = false

[[bench]]
name = "compare_criterion"
path = "benches/compare.rs"
harness = false
required-features = ["criterion-benches"]

[[bench]]
name = "basic_criterion"
path = "benches/basic.rs"
harness = false
required-features = ["criterion-benches"]

[[bench]]
name = "gungraun"
harness = false
required-features = ["gungraun-bench"]

[dev-dependencies]
calendrical_calculations = "0.2.4"
chrono = "0.4.45"
criterion = "0.8.2"
fastrand = "2.5.0"
fasttime = "0.3.0"
gungraun = "0.20.0"
hifitime = "4.3.1"
icu_calendar = { version = "2.3.0", default-features = false }
jiff = "0.2.38"
jiff-core = "0.1.1"
libc = "0.2.190"
quickcheck = "1.1.0"
speedate = "0.17.0"
tango-bench = "0.8.0"
time = { version = "0.3.55", features = ["quickcheck", "large-dates"] }
timezone_provider = "0.2.6"
zenbench = "0.1.10"
